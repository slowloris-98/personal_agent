# Personal Daily-Planning Agent — configuration
# Secrets (LLM API keys) live in .env, NOT here.

# Gmail accounts to read email from. `label` is the stable key for the cached
# token file (credentials/token_<label>.json) — don't rename it once authorized.
# `name` (optional) is how the account is labelled in the plan; it defaults to
# `label` if omitted. The account with `primary: true` owns Calendar, Tasks, and
# the output Doc.
accounts:
  - label: acct1
    name: Work
    primary: true
  - label: acct2
    name: Personal
  - label: acct3
    name: College

# What to collect each morning.
collect:
  email_query: "newer_than:1d"   # Gmail search syntax. e.g. "is:unread newer_than:1d"
  max_emails_per_account: 30
  calendar_id: primary           # calendar to read on the primary account
  timezone: "America/Los_Angeles"   # used for "today" bounds and RFC3339 timestamps

# Where the daily plans are written.
#   target: google_docs | notion
#
# google_docs: one Google Doc per day is created from the plan Markdown via
#   Drive's native Markdown importer, dropped into a Drive folder. By default the
#   agent creates and owns a folder named folder_name (works with the narrow
#   drive.file scope). Optionally set folder_id to a specific Drive folder id to
#   write there instead — but under drive.file that folder must be one this app
#   created or was explicitly granted, otherwise leave folder_id blank.
#
# notion: plans go under a "Daily Planning" page you create in Notion and share
#   with your integration — one weekly subpage, then one subpage per day (the
#   day's Markdown is dumped in directly). Put your integration token in .env as
#   NOTION_API_KEY, and the shared page's id in notion_root_page_id below.
output:
  target: notion
  folder_name: "Daily Plans"
  folder_id: ""                  # optional: specific Drive folder id (see note above)
  notion_root_page_id: "39956cf2624e8062b41dc31493ce1f94"

# LLM provider. Swappable: claude_code | anthropic | openai | groq
llm:
  provider: claude_code
  # model is ignored for claude_code (it uses your CLI's configured model).
  # For anthropic: claude-opus-4-8 ; openai: gpt-4o ; groq: llama-3.3-70b-versatile
  model: claude-sonnet-5
  max_tokens: 4000

# 24/7 communication layer (Telegram). Off by default — when enabled, the daily
# run also pushes each day's plan + emails to the always-on device (phone/Termux)
# over Tailscale, and a Telegram bot on that device answers your questions from a
# local SQLite store. See CLAUDE.md ("Communication layer") for setup.
#
# This block is read by BOTH machines:
#   - the PC uses `ingest_host` (where to push) and INGEST_TOKEN in .env.
#   - the phone uses `db_path`, `retention_days`, `provider`/`model`,
#     `allowed_chat_ids`, plus TELEGRAM_BOT_TOKEN + INGEST_TOKEN in .env.
responder:
  enabled: true
  ingest_host: "100.109.148.78:8000"              # PC -> phone push target, e.g. "phone-ts-name:8000"
  db_path: "data/agent.db"     # phone-local SQLite (source of truth)
  retention_days: 60           # emails older than this are pruned on the phone
  provider: openai          # answer LLM: anthropic | openai | ollama (switchable)
  model: gpt-5.4-mini
  allowed_chat_ids: [7038212187]         # your Telegram chat id(s); empty = allow anyone (unsafe)
